
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto
        run: unzip -q GDT-SK.zip -d extraido

      - name: Corrigir erro de Uri
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extraido/GDT-SK/app/src/main/java/com/gdtsk/recorder/Storage.kt")
          s = p.read_text()
          s = s.replace("update(uri, v, null, null)", "update(uri!!, v, null, null)")
          s = s.replace("delete(uri, null, null)", "delete(uri!!, null, null)")
          p.write_text(s)
          PY

      - name: Compilar APK
        working-directory: extraido/GDT-SK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: GDT-SK-apk
          path: extraido/GDT-SK/app/build/outputs/apk/release/*.apk
